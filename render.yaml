services:
  - type: web
    name: souclou
    runtime: docker
    plan: starter
    region: frankfurt
    buildCommand: docker build -t souclou .
    startCommand: sh -c "npx prisma migrate deploy && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: true
